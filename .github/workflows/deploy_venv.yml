name: Build and Release Dev Tarball

on:
  push:
    branches:
      - '**'           # Triggers on any branch you push to
      - '!main'        # Excludes main so it only runs during feature development
    # paths:
    #   - 'pyproject.toml'
    #   - 'poetry.lock'
    #   - '.github/workflows/build-dev-tarball.yml'
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write      # Required to push/update GitHub Releases

jobs:
  build-and-pack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # IMPORTANT: Match Google Colab's active Python version
          python-version: '3.13'
          cache: 'pip'

      - name: Install Poetry & Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry venv-pack

      - name: Create Native Venv & Configure Poetry
        run: |
          # 1. Create a standard native virtual environment at .venv (ensures pyvenv.cfg exists)
          python -m venv .venv

          # 2. Point Poetry to this exact environment
          poetry env use .venv/bin/python

          # 3. Install production dependencies (skipping dev dependencies)
          poetry install --no-root --without dev

      - name: Package Environment with venv-pack
        run: |
          # --python-prefix matches the extraction folder inside Google Colab
          venv-pack -p .venv -o colab_env.tar.gz --python-prefix /content/colab_venv --force

      - name: Publish Dev Tarball to Rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-env
          name: Development Colab Tarball
          body: "Rolling development tarball built automatically from branch `${{ github.ref_name }}` (Commit: ${{ github.sha }})."
          files: colab_env.tar.gz
          prerelease: true
