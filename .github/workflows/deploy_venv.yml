name: Build and Release venv wheels

on:
  push:
    # paths:
    #   - 'pyproject.toml'
    #   - 'poetry.lock'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Define wheel archive name
        id: name_container
        run: |
          echo "wheel_archive=dtc_is_notebooks-wheels-3.13.zip" | awk '{print tolower($0)}' >> $GITHUB_OUTPUT

      - name: Install PyPA build, Pip, and Poetry
        run: |
          python -m pip install --upgrade pip build poetry poetry-plugin-export

      - name: Build local package wheel (PEP 517 via poetry-core)
        run: |
          mkdir -p wheels
          python -m build --wheel --outdir wheels .

      - name: Export dependencies from poetry.lock
        run: |
          poetry export -f requirements.txt \
            --without dev \
            --without-hashes \
            --output wheels/requirements.txt

      - name: Download pre-built wheels (strictly binary, no build backends)
        run: |
          python -m pip download \
            --only-binary=:all: \
            --dest wheels \
            -r wheels/requirements.txt

      - name: Bundle archive
        run: |
          zip -rq ${{ steps.name_container.outputs.wheel_archive }} ./wheels

      - name: Create or Update Release Asset (Tagged Release)
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.name_container.outputs.wheel_archive }}
          draft: false
          prerelease: false
          generate_release_notes: true
          retention_days: 1

      - name: Update 'latest' Release on main push
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Prebuilt venv Wheels
          files: ${{ steps.name_container.outputs.wheel_archive }}
          prerelease: false
          retention_days: 1