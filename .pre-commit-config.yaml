default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        files: \.(py|ipynb|toml|yaml|yml)$
      - id: trailing-whitespace
      - id: name-tests-test
        args: ["--pytest-test-first"]

  # --- Notebook hygiene: strip volatile metadata, keep figures -------------
  # Ideally keep this hook in sync with the DESP configuration for notebook metadata stripping
  # See: https://github.com/SercoSPA/DESP-UserWorkflowService-Templates/blob/6851951bb076aa342369366cecb1265d90a9a514/.pre-commit-config.yaml#L15
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        name: strip notebook metadata (keep outputs)
        args:
          # Serco have `--keep-output`` enabled but keep off for now until we decide to keep notebook outputs.
          # NOTE: we should also add `--drop-output-type stream:stdout` and `--drop-output-type stream:stderr` to
          # remove output streams from notebooks.
          # - --keep-output
          - --extra-keys
          - metadata.language_info metadata.anaconda-cloud metadata.kernelspec

    # --- Secret scanning -----------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.9.9
    hooks:
      - id: ruff
        name: Check linting with ruff
        args: ["--config=pyproject.toml", "--fix"]
        files: .*\.(py|ipynb)$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: Check code security with bandit
        args:
          [
            "-q",
            "-c",
            "pyproject.toml",
            "--severity-level",
            "medium",
            "--confidence-level",
            "medium",
          ]

  - repo: local
    hooks:
      - id: pytest
        name: Run unit tests with pytest
        entry: poetry run pytest
        language: system
        types: [python]
        pass_filenames: false # run all tests, not just those that have been modified by the commit
        always_run: true
